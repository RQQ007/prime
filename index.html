<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIME</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='34' font-weight='700' text-anchor='middle' fill='%2339ff7a'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --g: #39ff7a;
    --g-dim: #1fae52;
    --g-deep: #0b3d1e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: 'Share Tech Mono', Consolas, monospace;
    color: var(--g);
    user-select: none;
    -webkit-user-select: none;
  }
  body.idle { cursor: none; }

  #rain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* затемнение за логотипом, виньетка и сканлайны */
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 32% at 50% 50%, rgba(0,0,0,.92) 0%, rgba(0,0,0,.75) 45%, rgba(0,0,0,0) 100%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.75) 100%);
  }
  .scan {
    position: fixed; inset: 0; pointer-events: none; opacity: .18;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.9) 3px);
    mix-blend-mode: multiply;
  }

  /* ---------- логотип ---------- */
  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .frame {
    position: relative;
    padding: clamp(28px, 5vw, 70px) clamp(30px, 6vw, 90px);
  }
  .logo {
    position: relative;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    font-weight: 900;
    font-size: clamp(54px, 12.5vw, 210px);
    line-height: 1;
    letter-spacing: .32em;
    margin-right: -.32em; /* компенсация последнего интервала */
    color: var(--g);
    text-shadow:
      0 0 6px rgba(57,255,122,.9),
      0 0 22px rgba(57,255,122,.55),
      0 0 60px rgba(57,255,122,.35),
      0 0 120px rgba(57,255,122,.2);
    animation: flicker 6s infinite steps(1);
  }
  .logo::before, .logo::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    color: var(--g);
    pointer-events: none;
    opacity: 0;
  }
  .logo::before { text-shadow: -3px 0 rgba(160,255,200,.8); animation: glitchA 4.2s infinite; }
  .logo::after  { text-shadow:  3px 0 rgba(0,180,80,.9);    animation: glitchB 4.2s infinite; }

  @keyframes glitchA {
    0%, 86%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); }
    87%  { opacity: 1; transform: translateX(-14px); clip-path: inset(18% 0 66% 0); }
    89%  { opacity: 1; transform: translateX(10px);  clip-path: inset(52% 0 30% 0); }
    91%  { opacity: 1; transform: translateX(-6px);  clip-path: inset(74% 0 12% 0); }
    93%  { opacity: 1; transform: translateX(18px);  clip-path: inset(34% 0 52% 0); }
    95%  { opacity: 0; }
  }
  @keyframes glitchB {
    0%, 87%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 100% 0); }
    88%  { opacity: 1; transform: translateX(16px);  clip-path: inset(62% 0 22% 0); }
    90%  { opacity: 1; transform: translateX(-12px); clip-path: inset(8% 0 80% 0); }
    92%  { opacity: 1; transform: translateX(8px);   clip-path: inset(42% 0 40% 0); }
    94%  { opacity: 0; }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    41% { opacity: .82; }
    42% { opacity: 1; }
    88% { opacity: .7; }
    89% { opacity: 1; }
  }

  /* глитч-штрихи сбоку от букв, как на референсе */
  .streaks { position: absolute; inset: 0; pointer-events: none; }
  .streaks i {
    position: absolute; height: 2px; background: var(--g);
    box-shadow: 0 0 8px var(--g);
    opacity: 0; animation: streak 4.2s infinite;
  }
  @keyframes streak {
    0%, 86%, 100% { opacity: 0; transform: scaleX(.2); }
    88% { opacity: .9; transform: scaleX(1); }
    92% { opacity: .6; transform: scaleX(.6) translateX(20px); }
    95% { opacity: 0; }
  }

  /* рамка-уголки */
  .corner {
    position: absolute; font-size: clamp(12px, 1.3vw, 22px);
    color: var(--g); text-shadow: 0 0 8px rgba(57,255,122,.6);
    display: flex; align-items: center; gap: .8em; white-space: nowrap;
  }
  .corner .ln { height: 2px; background: var(--g); box-shadow: 0 0 6px rgba(57,255,122,.6); }
  .tl { top: 0; left: 0; }
  .tl .ln { width: clamp(60px, 8vw, 160px); }
  .tl .prompt::after { content: '_'; animation: blink 1s steps(1) infinite; }
  .tr { top: 0; right: 0; }
  .tr .ln { width: clamp(50px, 7vw, 140px); }
  .tr::after {
    content: ''; position: absolute; right: 0; top: 50%;
    width: 2px; height: clamp(24px, 3vw, 48px);
    background: var(--g); box-shadow: 0 0 6px rgba(57,255,122,.6);
  }
  .bl { bottom: 0; left: 0; }
  .bl .ln:first-child { width: clamp(50px, 6vw, 120px); }
  .bl .ln:last-child  { width: clamp(80px, 11vw, 220px); }
  .bl::before {
    content: ''; position: absolute; left: 0; bottom: 50%;
    width: 2px; height: clamp(24px, 3vw, 48px);
    background: var(--g); box-shadow: 0 0 6px rgba(57,255,122,.6);
  }
  .br { bottom: 0; right: 0; }
  .br .ln { width: clamp(60px, 8vw, 150px); }
  .dots { letter-spacing: .2em; }
  @keyframes blink { 50% { opacity: 0; } }

  /* строка терминала под логотипом */
  .term {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(-1 * clamp(40px, 6vw, 80px));
    font-size: clamp(12px, 1.2vw, 18px);
    color: var(--g-dim); white-space: nowrap;
    text-shadow: 0 0 6px rgba(57,255,122,.4);
  }
  .term .cur { display: inline-block; width: .6em; height: 1.05em; vertical-align: -.15em; background: var(--g); margin-left: 2px; animation: blink 1s steps(1) infinite; }

  /* ---------- статус ---------- */
  .status {
    position: fixed; left: 50%; bottom: clamp(18px, 4vh, 40px); transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    border: 1px solid rgba(57,255,122,.35);
    background: rgba(0, 12, 4, .72);
    backdrop-filter: blur(6px);
    border-radius: 999px;
    font-size: 14px; letter-spacing: .12em;
    box-shadow: 0 0 24px rgba(57,255,122,.12), inset 0 0 12px rgba(57,255,122,.06);
    transition: border-color .4s, color .4s, box-shadow .4s;
    cursor: pointer;
  }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: pulse 1.6s ease-in-out infinite; }
  .status .time { color: #c8ffd9; min-width: 8ch; text-align: right; font-variant-numeric: tabular-nums; }
  .status .sep { width: 1px; height: 14px; background: rgba(57,255,122,.35); }
  .status.off { color: #ffcc55; border-color: rgba(255,204,85,.5); box-shadow: 0 0 24px rgba(255,204,85,.15); }
  .status.off .dot { background: #ffcc55; box-shadow: 0 0 10px #ffcc55; }
  .status.off .time, .status.off .sep { display: none; }
  @keyframes pulse { 50% { transform: scale(.65); opacity: .55; } }

  .hint {
    position: fixed; right: 18px; bottom: 14px;
    font-size: 11px; letter-spacing: .1em; color: rgba(57,255,122,.35);
    transition: opacity .6s;
  }
  body.idle .hint { opacity: 0; }

  @media (max-width: 640px) {
    .tr, .br .ln, .bl .ln:last-child { display: none; }
    .status { font-size: 12px; padding: 8px 14px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .logo::before, .logo::after, .streaks i { animation: none; }
  }
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="shade"></div>

  <div class="stage">
    <div class="frame">
      <div class="corner tl"><span class="prompt">&gt;</span><span class="ln"></span></div>
      <div class="corner tr"><span class="dots">...</span><span class="ln"></span></div>

      <div class="logo" data-text="PRIME">PRIME
        <div class="streaks">
          <i style="left:-6%;  top:22%; width:9%;  animation-delay:0s"></i>
          <i style="left:-3%;  top:58%; width:6%;  animation-delay:.05s"></i>
          <i style="left:30%;  top:40%; width:7%;  animation-delay:.1s"></i>
          <i style="left:46%;  top:70%; width:5%;  animation-delay:.02s"></i>
          <i style="left:62%;  top:28%; width:8%;  animation-delay:.08s"></i>
          <i style="left:93%;  top:50%; width:8%;  animation-delay:.04s"></i>
          <i style="left:96%;  top:80%; width:5%;  animation-delay:.12s"></i>
        </div>
      </div>

      <div class="corner bl"><span class="ln"></span><span class="dots">...</span><span class="ln"></span></div>
      <div class="corner br"><span class="ln"></span><span>// PRIME.exe</span></div>

      <div class="term"><span id="typed"></span><span class="cur"></span></div>
    </div>
  </div>

  <div class="scan"></div>

  <div class="status off" id="status" title="Нажмите, если индикатор жёлтый">
    <span class="dot"></span>
    <span id="label">ЗАПУСК…</span>
    <span class="sep"></span>
    <span class="time" id="time">00:00:00</span>
  </div>
  <div class="hint">ДВОЙНОЙ КЛИК — ПОЛНЫЙ ЭКРАН</div>

<script>
(() => {
  /* ================= ЦИФРОВОЙ ДОЖДЬ ================= */
  const cv = document.getElementById('rain');
  const ctx = cv.getContext('2d');
  const GLYPHS = '0123456789012345678901234567890123456789:=+-*<>|';
  let W, H, fs, drops = [];

  function newDrop(i, scatter) {
    const depth = Math.random();                     // 0 — далеко, 1 — близко
    return {
      x: i * fs + fs / 2,
      y: scatter ? Math.random() * (H / fs) * -1.2 : -Math.random() * 30,
      speed: 0.25 + depth * 0.75 + Math.random() * 0.15,
      size: Math.round(fs * (0.7 + depth * 0.45)),
      alpha: 0.28 + depth * 0.72,
      row: null,
      prevChar: null
    };
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fs = Math.max(14, Math.min(24, Math.round(W / 85)));
    const n = Math.ceil(W / fs);
    drops = Array.from({ length: n }, (_, i) => newDrop(i, true));
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  }

  const pick = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  function step() {
    // затухание следов
    ctx.fillStyle = 'rgba(0, 0, 0, 0.075)';
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      d.y += d.speed;
      const row = Math.floor(d.y);
      if (row === d.row) continue;

      ctx.font = `${d.size}px 'Share Tech Mono', Consolas, monospace`;

      // бывшая «голова» становится зелёной
      if (d.row !== null && d.row >= 0) {
        const py = d.row * fs;
        ctx.fillStyle = '#000';
        ctx.fillRect(d.x - fs / 2, py, fs, fs);
        ctx.fillStyle = `rgba(57, 255, 122, ${d.alpha * 0.85})`;
        ctx.fillText(d.prevChar, d.x, py);
      }

      // новая яркая «голова»
      const ch = pick();
      if (row >= 0) {
        ctx.fillStyle = `rgba(215, 255, 228, ${Math.min(1, d.alpha + 0.15)})`;
        ctx.fillText(ch, d.x, row * fs);
      }
      // иногда меняем символ внутри хвоста — «живой» код
      if (Math.random() < 0.04 && row > 3) {
        const r = row - 2 - ((Math.random() * 8) | 0);
        if (r >= 0) {
          ctx.fillStyle = '#000';
          ctx.fillRect(d.x - fs / 2, r * fs, fs, fs);
          ctx.fillStyle = `rgba(57, 255, 122, ${d.alpha * 0.55})`;
          ctx.fillText(pick(), d.x, r * fs);
        }
      }

      d.row = row; d.prevChar = ch;

      if (row * fs > H + Math.random() * H * 0.5) {
        drops[i] = newDrop(i, false);
      }
    }
  }

  let last = 0, acc = 0;
  const STEP = 1000 / 30;
  function loop(t) {
    acc += Math.min(200, t - last); last = t;
    while (acc >= STEP) { step(); acc -= STEP; }
    requestAnimationFrame(loop);
  }
  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(t => { last = t; loop(t); });

  /* ================= СТРОКА ТЕРМИНАЛА ================= */
  const lines = [
    'prime --keep-awake --forever',
    'system.sleep = disabled',
    'display.timeout = never',
    'status: online'
  ];
  const typed = document.getElementById('typed');
  let li = 0;
  async function typeLoop() {
    while (true) {
      const s = '> ' + lines[li];
      for (let i = 0; i <= s.length; i++) { typed.textContent = s.slice(0, i); await wait(45 + Math.random() * 50); }
      await wait(2200);
      for (let i = s.length; i >= 2; i--) { typed.textContent = s.slice(0, i); await wait(18); }
      await wait(300);
      li = (li + 1) % lines.length;
    }
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  typeLoop();

  /* ================= ЗАЩИТА ОТ СНА ================= */
  const st = document.getElementById('status');
  const label = document.getElementById('label');
  const timeEl = document.getElementById('time');
  let lock = null, onSince = null, total = 0;

  function setOn(on, text) {
    st.classList.toggle('off', !on);
    label.textContent = text;
    if (on && onSince === null) onSince = Date.now();
    if (!on && onSince !== null) { total += Date.now() - onSince; onSince = null; }
  }

  async function acquire() {
    if (!('wakeLock' in navigator)) {
      setOn(false, 'БРАУЗЕР НЕ ПОДДЕРЖИВАЕТ — ОТКРОЙТЕ В CHROME / EDGE');
      return;
    }
    if (lock) return;
    try {
      lock = await navigator.wakeLock.request('screen');
      setOn(true, 'СОН ОТКЛЮЧЁН');
      lock.addEventListener('release', () => {
        lock = null;
        setOn(false, 'ПАУЗА — ВЕРНИТЕСЬ НА ВКЛАДКУ');
      });
    } catch (e) {
      setOn(false, 'НАЖМИТЕ, ЧТОБЫ ВКЛЮЧИТЬ');
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') acquire();
  });
  addEventListener('pointerdown', acquire);
  addEventListener('keydown', acquire);
  acquire();

  const pad = n => String(n).padStart(2, '0');
  setInterval(() => {
    const ms = total + (onSince ? Date.now() - onSince : 0);
    const s = Math.floor(ms / 1000);
    const txt = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
    timeEl.textContent = txt;
    document.title = lock ? `PRIME · ${txt}` : 'PRIME · пауза';
  }, 500);

  /* ================= ПОЛНЫЙ ЭКРАН И КУРСОР ================= */
  addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  });
  let idleT;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => document.body.classList.add('idle'), 3000);
  };
  addEventListener('mousemove', wake);
  wake();
})();
</script>
</body>
</html>
